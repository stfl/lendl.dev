<!DOCTYPE html>
<html lang="{% block lang %}{{ lang }}{% endblock %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
    <meta name="author" content="{{ config.author }}">
    <link rel="alternate" type="application/atom+xml" title="{{ config.author }} - Blog" href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">
    <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
</head>
<body>
    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{ now() | date(format="%Y") }} {{ config.author }}</p>
                <nav class="footer-nav">
                    <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
                    <a href="{{ get_url(path='@/impressum.md') }}">Impressum</a>
                    <a href="{{ get_url(path='@/datenschutz.md') }}">Datenschutz</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
