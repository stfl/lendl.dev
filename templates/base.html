<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
    <meta name="author" content="{{ config.extra.author }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ config.base_url }}{% endblock %}">
    {% block head %}{% endblock %}

    <!-- Twitter falls back to the Open Graph title and description -->
    <meta name="twitter:card" content="summary">

    <link rel="alternate" type="application/atom+xml" title="{{ config.extra.author }} - Blog" href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}</p>
                <nav class="footer-nav">
                    <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
                    <a href="{{ get_url(path='@/impressum.md') }}">Impressum</a>
                    <a href="{{ get_url(path='@/datenschutz.md') }}">Datenschutz</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
